<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Optimization -->
    <title>Subject Study Planner | GATE 2027</title>
    <meta name="description"
        content="Data-driven study planner for GATE CSE 2027. Track daily lectures, DPPs, topic progress, and revisions with glassmorphic aesthetics.">
    <meta name="keywords" content="GATE 2027, Study Planner, GATE CSE, Lecture Tracker, DPPs, Topic Progress">
    <meta name="author" content="GATE Aspirant">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/components/planner.css">

    <!-- CDN Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

    <!-- Config & Core -->
    <script src="../assets/js/config/config.js" defer></script>
    <script src="../assets/js/core/auth.js" defer></script>
    <script src="../assets/js/core/error-handler.js" defer></script>
    <script src="../assets/js/core/utils.js" defer></script>
    <script src="../assets/js/core/storage.js" defer></script>
    <script src="../assets/js/core/ui.js" defer></script>

    <!-- Services -->
    <script src="../assets/js/services/subject-service.js" defer></script>
    <script src="../assets/js/services/progress-service.js" defer></script>
    <script src="../assets/js/services/planner-service.js" defer></script>

    <!-- Application Entry Point Router -->
    <script src="../assets/js/app.js" defer></script>
</head>

<body class="app-layout subject-page">

    <!-- Loading Overlay -->
    <div id="app-loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <span class="loading-text">Loading study planner...</span>
        </div>
    </div>

    <!-- Offline Banner -->
    <div id="offline-banner">⚠ You're offline. Some features may be unavailable.</div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Ambient Dynamic Theme Glow -->
    <div class="bg-canvas" aria-hidden="true"></div>

    <!-- App Main Layout Area -->
    <div class="app-main">

        <!-- Topbar -->
        <header class="app-topbar">
            <a href="../index.html" class="subject-back-nav" aria-label="Back to Dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </a>

            <div class="topbar-widgets">
                <div class="topbar-countdown" id="header-countdown-widget" title="Countdown to Est. Completion (15 Dec 2026)">
                    <span class="countdown-time" id="header-countdown-time">--d --h --m --s</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content-wrapper">

            <!-- Sticky Subject Progress Header -->
            <section class="subject-sticky-header" id="subject-sticky-header" aria-label="Subject Progress">
                <!-- Populated dynamically by planner-service.js -->
            </section>

            <!-- Module Navigation Grid -->
            <section id="subject-nav-section" class="subject-nav-section" aria-label="Subject Navigation">
                <!-- Populated dynamically by planner-service.js -->
            </section>

            <!-- Planner Schedule / Day Cards -->
            <section id="subject-planner-section" class="subject-planner-section" aria-label="Study Schedule">
                <!-- Populated dynamically from data/planners/{id}.json by planner-service.js -->
            </section>

            <!-- Container hook for backward compatibility -->
            <div id="subject-content-container" style="display: none;"></div>

        </main>
    </div>

</body>

</html>
